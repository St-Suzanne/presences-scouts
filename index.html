<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Présences Scouts</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/app-icon.svg">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="Présences">
</head>
<body>

  <header>
    <h1 id="app-title">Prise de Présences</h1>
  </header>

  <!-- Bandeau de debug supprimé -->

  <main>
    <!-- Chargement initial -->
    <div id="screen-loading" class="screen active">
      <div class="card loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Chargement des données Google Sheet...</p>
      </div>
    </div>

    <!-- Écran 1 : Sélection Section -->
    <!-- Écran Login : authentification -->
    <div id="screen-login" class="screen">
      <div class="card">
        <h2>Connexion</h2>
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" placeholder="Entrez le mot de passe" />
        <div style="margin-top:8px;">
          <label><input id="login-remember" type="checkbox" /> Se souvenir du mot de passe</label>
        </div>
        <p id="login-message" style="color:red;min-height:1.2em;"></p>
        <div style="margin-top:12px;">
          <button class="btn" id="btn-login">Se connecter</button>
        </div>
      </div>
    </div>

    <div id="screen-sections" class="screen">
      <div class="card">
        <h2>1. Choisissez votre section</h2>
        <div id="sections-container"></div>
      </div>
    </div>

    <!-- Écran 2 : Sélection Date -->
    <div id="screen-dates" class="screen">
      <div class="card">
        <span class="badge" id="selected-section-badge"></span>
        <h2>2. Choisissez la date de réunion</h2>
        <div id="dates-container"></div>
        <button class="btn btn-secondary" id="btn-back-sections">Retour</button>
      </div>
    </div>

    <!-- Écran 3 : Liste des animés et Émargement -->
    <div id="screen-animes" class="screen">
      <div class="card">
        <span class="badge" id="summary-badge"></span>
        <h2>3. Présences des animés</h2>
        <div id="animes-container"></div>
        <button class="btn" id="btn-submit-presences">Enregistrer dans Google Sheet</button>
        <button class="btn btn-secondary" id="btn-back-dates">Retour</button>
      </div>
    </div>
  </main>
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
